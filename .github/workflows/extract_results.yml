name: Extract Results

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: spatialpath-results
          path: results

      - name: List files
        run: |
          ls -la results/
          ls -la results/figures/
          cat results/report.json

      - name: Commit figures
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p figures
          cp results/figures/*.png figures/ || true
          git add figures/
          git diff --staged --quiet || git commit -m "Add result figures"
          git push
