name: Run SpatialPath Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz graphviz-dev

      - name: install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install leidenalg python-igraph
          pip install -e .

      - name: download Visium data
        run: |
          mkdir -p data/visium_demo
          cd data/visium_demo
          wget https://cf.10xgenomics.com/samples/spatial-exp/1.3.0/Visium_Human_Breast_Cancer/Visium_Human_Breast_Cancer_filtered_feature_bc_matrix.h5
          wget https://cf.10xgenomics.com/samples/spatial-exp/1.3.0/Visium_Human_Breast_Cancer/Visium_Human_Breast_Cancer_spatial.tar.gz
          tar -xzf Visium_Human_Breast_Cancer_spatial.tar.gz
          ls -la
          ls -la spatial/

      - name: run pipeline
        run: |
          spatialpath data/visium_demo --output-dir results

      - name: upload results
        uses: actions/upload-artifact@v4
        with:
          name: spatialpath-results
          path: results/
